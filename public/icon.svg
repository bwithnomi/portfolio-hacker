<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hackerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc33;stop-opacity:1" />
    </linearGradient>
    <filter id="hackerGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="180" height="180" fill="#000000" rx="20"/>
  
  <!-- Terminal prompt symbol -->
  <path d="M45 90 L80 55 L80 125 Z" 
        fill="url(#hackerGrad)" 
        filter="url(#hackerGlow)"
        opacity="0.95"/>
  
  <!-- Terminal cursor/underscore -->
  <rect x="90" y="110" width="45" height="10" 
        fill="#00ff41" 
        filter="url(#hackerGlow)"
        opacity="0.9"/>
  
  <!-- Binary code accents -->
  <circle cx="35" cy="35" r="5" fill="#00ff41" opacity="0.6"/>
  <circle cx="145" cy="35" r="5" fill="#00cc33" opacity="0.6"/>
  <circle cx="35" cy="145" r="5" fill="#00ff41" opacity="0.6"/>
  <circle cx="145" cy="145" r="5" fill="#00cc33" opacity="0.6"/>
  
  <!-- Scanline effect -->
  <line x1="0" y1="70" x2="180" y2="70" 
        stroke="#00ff41" 
        stroke-width="2" 
        opacity="0.1"/>
  <line x1="0" y1="110" x2="180" y2="110" 
        stroke="#00ff41" 
        stroke-width="2" 
        opacity="0.1"/>
</svg>
